name: Development Build

on:
  push:
    branches-ignore:
      - Release

jobs:
  build:
    runs-on: backup-dev

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Maven
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q maven libimage-exiftool-perl

      - name: Configure Maven settings
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << 'EOF'
          <settings>
            <servers>
              <server>
                <id>Snapshots</id>
                <username>deployment</username>
                <password>${{ secrets.NEXUS_PASSWORD }}</password>
              </server>
              <server>
                <id>Releases</id>
                <username>deployment</username>
                <password>${{ secrets.NEXUS_PASSWORD }}</password>
              </server>
              <server>
                <id>main</id>
                <username>deployment</username>
                <password>${{ secrets.NEXUS_PASSWORD }}</password>
              </server>
            </servers>
            <mirrors>
              <mirror>
                <id>main</id>
                <mirrorOf>central</mirrorOf>
                <url>http://nexus.jbrmmg.me.uk:8081/repository/maven-public/</url>
              </mirror>
            </mirrors>
            <profiles>
              <profile>
                <id>default</id>
                <properties>
                  <repository.url>http://nexus.jbrmmg.me.uk:8081/repository</repository.url>
                </properties>
              </profile>
            </profiles>
            <activeProfiles>
              <activeProfile>default</activeProfile>
            </activeProfiles>
          </settings>
          EOF

      - name: Compute version
        run: echo "VERSION=$(date +'%Y.%m.%d')-SNAPSHOT" >> $GITHUB_ENV

      - name: Build and Test with Maven
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: mvn verify -Drevision=${{ env.VERSION }}

      - name: Build Docker image
        run: |
          docker build \
            -f src/main/resources/docker/Dockerfile \
            -t nexus.jbrmmg.me.uk:8083/backup-dev:${{ github.sha }} \
            -t nexus.jbrmmg.me.uk:8083/backup-dev:latest \
            .

      - name: Push to Nexus Docker registry
        run: |
          docker login nexus.jbrmmg.me.uk:8083 \
            -u deployment \
            -p ${{ secrets.NEXUS_PASSWORD }}
          docker push nexus.jbrmmg.me.uk:8083/backup-dev:${{ github.sha }}
          docker push nexus.jbrmmg.me.uk:8083/backup-dev:latest

      - name: Deploy
        env:
          DB_DEV_BACKUP_SERVER: ${{ secrets.DB_DEV_BACKUP_SERVER }}
          DB_DEV_BACKUP_USER: ${{ secrets.DB_DEV_BACKUP_USER }}
          DB_DEV_BACKUP_PASSWORD: ${{ secrets.DB_DEV_BACKUP_PASSWORD }}
        run: |
          docker login nexus.jbrmmg.me.uk:8084 \
            -u deployment \
            -p ${{ secrets.NEXUS_PASSWORD }}
          echo "DB_DEV_BACKUP_SERVER=${DB_DEV_BACKUP_SERVER}" > .env
          echo "DB_DEV_BACKUP_USER=${DB_DEV_BACKUP_USER}" >> .env
          echo "DB_DEV_BACKUP_PASSWORD=${DB_DEV_BACKUP_PASSWORD}" >> .env
          docker compose -f docker-compose-dev.yml pull
          docker compose -f docker-compose-dev.yml up -d
