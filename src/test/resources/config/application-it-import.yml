spring:
  jpa.properties.hibernate.dialect: org.hibernate.dialect.MySQLDialect
  liquibase:
    change-log: classpath:/db/changelog/it-import/db.changelog-it-import-master.yaml

logging.file.name: ./target/test/log/itegrationtest.log
logging:
  logback:
    rollingpolicy:
      max-history: 3
      max-file-size: 100MB

backup:
  enabled: false
  ffmpeg-command: cp %%INPUT%% %%OUTPUT%%
  summary-enabled: true
  import-threads: 5
  load-cache-on-startup: false
