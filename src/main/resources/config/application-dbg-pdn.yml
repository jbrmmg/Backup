
logging:
  file:
    name: /home/jason/Working/MiddleTier-Backup-DBG.log
  level:
    ROOT: INFO
    com.jbr.middletier: DEBUG
  logback:
    rollingpolicy:
      max-history: 3
      max-file-size: 100MB
#    org.hibernate.orm.jdbc.bind: TRACE
#    org.hibernate.type.descriptor.sql: TRACE

spring:
  datasource:
    url: ${db.pdn.backup.server}?autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true
    username: ${db.pdn.backup.user}
    password: ${db.pdn.backup.password}

  liquibase:
    enabled: false

  jpa:
    properties:
      hibernate:
        format_sql: true
#    show-sql: true

backup:
  import-threads: 1
  directory:
    name: /home/jason/Working/BackupDev
    days: 5
    zip: /home/jason/Working/BackupDevZip
  schedule: 0 0 0/2 * * ?
  enabled: false
  email:
    enabled: true

  db-url: ${db.dev.backup.server}?autoReconnect=true&useSSL=false
  db-username: ${db.dev.backup.user}
  db-password: ${db.dev.backup.password}

  zip-directory: /home/jason/Working/BackupDevZip

server:
  port: 13013

info:
  app:
    version: Debug
