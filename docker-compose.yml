services:
  backup:
    image: nexus.jbrmmg.me.uk:8084/backup:latest
    container_name: backup
    restart: unless-stopped
    ports:
      - "12013:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=pdn
      - SERVER_PORT=8080
      - DB_PDN_BACKUP_SERVER=${DB_PDN_BACKUP_SERVER}
      - DB_PDN_BACKUP_USER=${DB_PDN_BACKUP_USER}
      - DB_PDN_BACKUP_PASSWORD=${DB_PDN_BACKUP_PASSWORD}
      - EMAIL_PDN_BACKUP_PASSWORD=${EMAIL_PDN_BACKUP_PASSWORD}
      - SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT=org.hibernate.dialect.MySQLDialect
    volumes:
      - backup-logs:/app/logs
      - /etc:/host/etc:ro
      - /home/jason:/host/home/jason:ro
      - type: bind
        source: /media
        target: /media
        bind:
          propagation: rshared
    networks:
      - jbr-network

volumes:
  backup-logs:

networks:
  jbr-network:
    external: true
